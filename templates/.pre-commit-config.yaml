# Baseline pre-commit config for hsf-training repos. Tailor it to the repo:
# see "Tailoring templates" in knowledge/standards.md, and delete these comments.
ci:
  autoupdate_schedule: monthly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
      # Only if the repo has Python files:
      # - id: debug-statements

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["-I", "codespell.txt"] # the file must exist, even if empty

  # Only if the lesson has Python code blocks in Markdown:
  # - repo: https://github.com/adamchainz/blacken-docs
  #   rev: 1.20.0
  #   hooks:
  #     - id: blacken-docs
  #       additional_dependencies: [black]

  # Only if notebook outputs should not be committed (not for books that
  # render stored outputs):
  # - repo: https://github.com/kynan/nbstripout
  #   rev: 0.9.1
  #   hooks:
  #     - id: nbstripout
