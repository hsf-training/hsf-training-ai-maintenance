version: 2
updates:
  # Keep GitHub Actions up to date (required for repos with workflows).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

  # Add only ecosystems the repo actually has manifests for, e.g.:
